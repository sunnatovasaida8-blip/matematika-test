<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Testi - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29, #38ef7d);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #e0e0e0;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 10px;
        }

        input::placeholder {
            color: #ccc;
        }

        select option {
            background: #222;
            color: #fff;
        }

        button {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.4);
        }

        .question-box {
            font-size: 22px;
            margin: 20px 0;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .option-btn:active {
            transform: scale(0.90);
            background: rgba(56, 239, 125, 0.4);
        }

        .hidden {
            display: none !important;
        }

        .score-text {
            font-size: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="register-screen">
        <h2>👋 Xush kelibsiz!</h2>
        <div class="form-group">
            <label>Ismingizni kiriting:</label>
            <input type="text" id="username" placeholder="Masalan: Azizbek">
        </div>
        <div class="form-group">
            <label>Nechinchi sinfsiz?</label>
            <select id="grade">
                <option value="1">1-sinf</option>
                <option value="2">2-sinf</option>
                <option value="3">3-sinf</option>
                <option value="4">4-sinf</option>
            </select>
        </div>
        <button onclick="startTest()">Testni Boshlash 🚀</button>
    </div>

    <div class="container hidden" id="quiz-screen">
        <h3 id="user-greeting" style="margin-bottom: 10px; color: #38ef7d;"></h3>
        <div id="progress" style="font-size: 14px; margin-bottom: 10px; color: #ccc;"></div>
        <div class="question-box" id="question-text">5 + 3 = ?</div>
        <div class="options-grid" id="options-container">
            <!-- Variantlar avtomatik chiqadi -->
        </div>
    </div>

    <div class="container hidden" id="result-screen">
        <h2>🎉 Test Yakunlandi!</h2>
        <p class="score-text" id="final-score"></p>
        <button onclick="restartTest()">Qaytadan Boshlash 🔄</button>
    </div>

    <script>
        let userName = "";
        let userGrade = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 5;
        let correctAnswer = 0;

        function startTest() {
            const nameInput = document.getElementById("username").value.trim();
            if (!nameInput) {
                alert("Iltimos, ismingizni kiriting!");
                return;
            }
            userName = nameInput;
            userGrade = parseInt(document.getElementById("grade").value);

            document.getElementById("register-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("user-greeting").innerText = `${userName} (${userGrade}-sinf)`;

            loadQuestion();
        }

        function generateQuestion() {
            let num1, num2, op;
            const ops = userGrade === 1 ? ['+', '-'] : userGrade === 2 ? ['+', '-', '*'] : ['+', '-', '*', '/'];
            op = ops[Math.floor(Math.random() * ops.length)];

            if (userGrade === 1) {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                if (op === '-' && num1 < num2) [num1, num2] = [num2, num1]; // Manfiy chiqmasligi uchun
            } else if (userGrade === 2) {
                num1 = Math.floor(Math.random() * 20) + 5;
                num2 = Math.floor(Math.random() * 20) + 1;
                if (op === '-' && num1 < num2) [num1, num2] = [num2, num1];
                if (op === '*') { num1 = Math.floor(Math.random() * 9) + 1; num2 = Math.floor(Math.random() * 9) + 1; }
            } else if (userGrade === 3) {
                num1 = Math.floor(Math.random() * 50) + 10;
                num2 = Math.floor(Math.random() * 50) + 5;
                if (op === '-' && num1 < num2) [num1, num2] = [num2, num1];
                if (op === '*') { num1 = Math.floor(Math.random() * 12) + 2; num2 = Math.floor(Math.random() * 10) + 1; }
            } else {
                // 4-sinf
                num1 = Math.floor(Math.random() * 100) + 20;
                num2 = Math.floor(Math.random() * 100) + 10;
                if (op === '-' && num1 < num2) [num1, num2] = [num2, num1];
                if (op === '*') { num1 = Math.floor(Math.random() * 20) + 5; num2 = Math.floor(Math.random() * 10) + 2; }
                if (op === '/') { 
                    num2 = Math.floor(Math.random() * 9) + 2;
                    let multiplier = Math.floor(Math.random() * 10) + 2;
                    num1 = num2 * multiplier; // Qoldiqsiz bo'linishi uchun
                }
            }

            if (op === '+') correctAnswer = num1 + num2;
            if (op === '-') correctAnswer = num1 - num2;
            if (op === '*') correctAnswer = num1 * num2;
            if (op === '/') correctAnswer = num1 / num2;

            return `${num1} ${op === '*' ? '×' : op === '/' ? '÷' : op} ${num2} = ?`;
        }

        function loadQuestion() {
            if (currentQuestion >= totalQuestions) {
                showResults();
                return;
            }

            document.getElementById("progress").innerText = `${currentQuestion + 1}-savol / ${totalQuestions}`;
            const qText = generateQuestion();
            document.getElementById("question-text").innerText = qText;

            // Variantlarni hosil qilish
            let options = [correctAnswer];
            while (options.length < 4) {
                let wrong = correctAnswer + (Math.floor(Math.random() * 10) - 5);
                if (wrong !== correctAnswer && !options.includes(wrong) && wrong >= 0) {
                    options.push(wrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById("options-container");
            container.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === correctAnswer) {
                score++;
            }
            currentQuestion++;
            loadQuestion();
        }

        function showResults() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").innerText = `${userName}, siz ${totalQuestions} ta savoldan ${score} tasiga to'g'ri javob berdingiz! 🌟`;
        }

        function restartTest() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("register-screen").classList.remove("hidden");
        }
    </script>
</body>
</html>
